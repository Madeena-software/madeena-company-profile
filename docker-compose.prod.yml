services:
  app:
    image: ${DOCKER_IMAGE:-docker.io/${DOCKERHUB_USERNAME:-your-dockerhub-username}/madeena-company-profile:latest}
    container_name: madeena_profile_app
    restart: unless-stopped
    working_dir: /var/www/app
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL:-http://127.0.0.1:8011}
      APP_VERSION: ${APP_VERSION:-latest}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-madeena_company_profile}
      DB_USERNAME: ${DB_USERNAME:-madeena}
      DB_PASSWORD: ${DB_PASSWORD:-madeena_pass}
      APP_TIMEZONE: Asia/Jakarta
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: error
      FILESYSTEM_DISK: public
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./storage:/var/www/app/storage
      - ./bootstrap/cache:/var/www/app/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8011:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: madeena_profile_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-madeena_company_profile}
      MYSQL_USER: ${DB_USERNAME:-madeena}
      MYSQL_PASSWORD: ${DB_PASSWORD:-madeena_pass}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
