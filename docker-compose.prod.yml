services:
  app:
    image: ${DOCKER_IMAGE:-docker.io/${DOCKERHUB_USERNAME:-your-dockerhub-username}/madeena-company-profile:latest}
    container_name: madeena_profile_app
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://${APP_DOMAIN}/company-profile
      OCTANE_SERVER: frankenphp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-madeena_company_profile}
      DB_USERNAME: ${DB_USERNAME:-madeena}
      DB_PASSWORD: ${DB_PASSWORD:-madeena_pass}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8015:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: madeena_profile_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-madeena_company_profile}
      MYSQL_USER: ${DB_USERNAME:-madeena}
      MYSQL_PASSWORD: ${DB_PASSWORD:-madeena_pass}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: madeena_profile_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-null}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
