server {
    listen 80;
    listen 443 ssl http2;
    server_name _;

    # SSL configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$APP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirect HTTP to HTTPS
    if ($scheme != "https") {
        return 301 https://$server_name$request_uri;
    }

    # Set real IP from proxy
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    # Root for subdirectory /company-profile
    root /var/www/app/public;
    index index.php;

    charset utf-8;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Subdirectory routing: /company-profile
    location /company-profile {
        alias /var/www/app/public;
        index index.php;

        # Laravel rewrite rules for subdirectory
        location ~ ^/company-profile(.*)$ {
            set $path $1;
            try_files $path $path/ /company-profile/index.php?$query_string;
        }

        # PHP processing for subdirectory
        location ~ ^/company-profile/(.+\.php)$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
            fastcgi_param PATH_INFO $1;
            fastcgi_param REQUEST_URI /company-profile$uri;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }
    }

    # Block direct access to hidden files
    location ~ /\.ht {
        deny all;
    }

    # Static files with long cache
    location ~* /company-profile/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
