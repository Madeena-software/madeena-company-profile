# -----------------------------------------------------------------------------
# Madeena Company Profile - Production Simulation (Docker Compose)
# -----------------------------------------------------------------------------
# ALWAYS run via:  scripts/simulate-prod.sh
# Or manually:     docker compose --env-file .env.simulation -f docker-compose.simulation.yml <cmd>
#
# The --env-file flag is REQUIRED for compose variable substitution to work.
# -----------------------------------------------------------------------------

services:

  # MySQL 8.4: starts first, all others depend on it.
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - madeena_cp_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null | grep -q Uptime"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # Laravel PHP-FPM application.
  # entrypoint runs: migrate --force, config:cache, route:cache, then php-fpm
  # Queue MUST wait for this to be healthy before starting (migrations race condition).
  app:
    image: madeena_cp:simulation
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: simulation
    environment:
      PHP_FPM_ONLY: "1"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - app_public:/var/www/public-files
    env_file: .env.simulation
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000);if(!$$s)exit(1);fclose($$s);'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    depends_on:
      - db
    networks:
      madeena_cp_network:
        aliases:
          - madeena_cp_app

  # Laravel queue worker.
  # Depends on APP (not DB) so it starts only after migrations have been applied.
  queue:
    image: madeena_cp:simulation
    command:
      - sh
      - -lc
      - |
        until php artisan migrate:status >/dev/null 2>&1; do
          echo "[queue] waiting for migrations to be ready..."
          sleep 5
        done
        exec php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --memory=128
    stop_grace_period: 120s
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    env_file: .env.simulation
    environment:
      CACHE_STORE: database
    depends_on:
      - app
    networks:
      - madeena_cp_network

  # Nginx web server.
  nginx:
    image: nginx:alpine
    ports:
      - "8011:80"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - madeena_cp_network

volumes:
  db_data:
  app_storage:
  app_logs:
  app_public:

networks:
  madeena_cp_network:
    driver: bridge
