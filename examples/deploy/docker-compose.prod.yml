# ─────────────────────────────────────────────────────────────────────────────
# Madeena Workspace — Production Docker Compose
#
# Required environment variables (supply via .env on the server):
#   DOCKERHUB_USERNAME   Docker Hub account name
#   IMAGE_TAG            Image tag to pull (CI now uses "latest" only)
#   APP_KEY              Laravel application key
#   APP_DOMAIN           Public domain name
#   DB_DATABASE          MySQL database name
#   DB_USERNAME          MySQL application user
#   DB_PASSWORD          MySQL application password
#   DB_ROOT_PASSWORD     MySQL root password
#
# Hybrid storage strategy:
#   SSD  — DB data, app storage (named volumes, managed by Docker)
#   HDD  — Enterprise user files physically mounted at /media/nextcloud-data
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Laravel PHP-FPM application ──────────────────────────────────────────────
  app:
    image: ${DOCKERHUB_USERNAME}/madeena-workspace:${IMAGE_TAG:-latest}
    restart: always
    environment:
      PHP_FPM_ONLY: "1"
    volumes:
      # Enterprise storage — HDD physically mounted on host
      - /media/nextcloud-data/madeena_storage:/var/www/enterprise_data
      # Persistent application storage (uploads, cache, logs, sessions) on SSD
      - app_storage:/var/www/html/storage
      # Shared public directory so Nginx can serve static assets directly
      - app_public:/var/www/public-files
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - madeena_network

  # ── Laravel queue worker ─────────────────────────────────────────────────────
  queue:
    image: ${DOCKERHUB_USERNAME}/madeena-workspace:${IMAGE_TAG:-latest}
    restart: always
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-jobs=500"]
    volumes:
      # Same HDD mount as app so background jobs can process enterprise files
      - /media/nextcloud-data/madeena_storage:/var/www/enterprise_data
      - app_storage:/var/www/html/storage
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - madeena_network

  # ── MySQL 8.4 database (SSD via named volume) ─────────────────────────────────
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - madeena_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Nginx web server ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8010:80"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - madeena_network

volumes:
  db_data:
  app_storage:
  app_public:

networks:
  madeena_network:
    driver: bridge
