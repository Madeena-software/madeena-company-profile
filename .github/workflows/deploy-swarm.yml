name: Deploy to Production (Swarm)

on:
  workflow_dispatch:

concurrency:
  group: deploy-madeena_cp-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  build:
    name: Build Docker Image (Local)
    runs-on: self-hosted
    timeout-minutes: 25
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        run: |
          set -euo pipefail
          APP_VERSION="$(cat VERSION 2>/dev/null || echo latest)"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploy version: ${APP_VERSION}"

      - name: Build Docker image locally
        run: |
          set -euo pipefail
          echo "===> Building madeena_cp:latest on local runner..."
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.app_version }}" \
            --tag madeena_cp:latest \
            --file ./Dockerfile \
            .
          docker image inspect madeena_cp:latest --format 'ID: {{.Id}} | Size: {{.Size}} bytes'

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Docker Swarm
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NEXTCLOUD_WEBDAV_BASE_URI: ${{ secrets.NEXTCLOUD_WEBDAV_BASE_URI }}
          NEXTCLOUD_WEBDAV_USERNAME: ${{ secrets.NEXTCLOUD_WEBDAV_USERNAME }}
          NEXTCLOUD_WEBDAV_PASSWORD: ${{ secrets.NEXTCLOUD_WEBDAV_PASSWORD }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          set -euo pipefail

          require_env() {
            var="$1"
            val="$(eval "printf '%s' \"\${${var}:-}\"")"
            if [ -z "$val" ]; then
              echo "FATAL: ${var} is missing or empty."
              exit 1
            fi
          }

          for var in APP_KEY APP_DOMAIN REMOTE_PATH DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD NEXTCLOUD_USERNAME NEXTCLOUD_WEBDAV_BASE_URI NEXTCLOUD_WEBDAV_USERNAME NEXTCLOUD_WEBDAV_PASSWORD; do
            require_env "$var"
          done

          if [ "$DB_HOST" = "127.0.0.1" ] || [ "$DB_HOST" = "localhost" ]; then
            echo "FATAL: DB_HOST is '$DB_HOST'. Use the Swarm service name: db."
            exit 1
          fi

          if [ "$DB_HOST" != "db" ]; then
            echo "FATAL: DB_HOST must be 'db' for the Swarm deployment."
            exit 1
          fi

          _sudo() {
            if [ -n "${SUDO_PASSWORD:-}" ]; then
              echo "$SUDO_PASSWORD" | sudo -S "$@" 2>/dev/null
            else
              sudo "$@"
            fi
          }

          export LIVE_VERSION="${APP_VERSION:-unknown}"
          export APP_STORAGE_HOST_PATH="/var/lib/madeena_cp/storage"
          export APP_LOGS_HOST_PATH="/media/nextcloud-data/data/${NEXTCLOUD_USERNAME}/files/madeena_cp_laravel_logs"
          export MYSQL_DATA_HOST_PATH="/var/lib/madeena_cp/mysql"

          echo "===> Clearing exited containers from previous runs..."
          docker container prune -f || true

          echo "===> Preparing persistent host paths..."
          _sudo mkdir -p \
            "$APP_STORAGE_HOST_PATH/app/private" \
            "$APP_STORAGE_HOST_PATH/app/public" \
            "$APP_LOGS_HOST_PATH" \
            "$MYSQL_DATA_HOST_PATH"
          _sudo chown -R www-data:www-data "$APP_STORAGE_HOST_PATH" "$APP_LOGS_HOST_PATH" 2>/dev/null || true
          _sudo chmod -R 775 "$APP_STORAGE_HOST_PATH" "$APP_LOGS_HOST_PATH" 2>/dev/null || true
          _sudo chown 999:999 "$MYSQL_DATA_HOST_PATH" 2>/dev/null || true
          _sudo chmod 750 "$MYSQL_DATA_HOST_PATH" 2>/dev/null || true

          echo "===> Preparing deployment root..."
          if [ "$REMOTE_PATH" = "/var/www" ] || [ "$REMOTE_PATH" = "/srv" ] || [ "$REMOTE_PATH" = "/opt" ] || [ "$REMOTE_PATH" = "/var" ]; then
            echo "FATAL: REMOTE_PATH must be a dedicated app directory, not a shared root."
            exit 1
          fi

          _sudo mkdir -p "$REMOTE_PATH"
          _sudo chown -R "$(id -un):$(id -gn)" "$REMOTE_PATH"

          if [ ! -w "$REMOTE_PATH" ]; then
            echo "FATAL: Runner user $(id -un) cannot write to $REMOTE_PATH."
            ls -ld "$REMOTE_PATH" || true
            exit 1
          fi

          cd "$REMOTE_PATH"
          cp "$GITHUB_WORKSPACE/docker-compose.prod.yml" docker-compose.prod.yml
          mkdir -p nginx/conf.d
          cp "$GITHUB_WORKSPACE/nginx/conf.d/app.conf" nginx/conf.d/app.conf
          echo "$LIVE_VERSION" > VERSION-CURRENT

          echo "===> Resolving WebDAV URI for containers..."
          HOST_IP="$(hostname -I | awk '{print $1}')"
          WEBDAV_HOSTNAME="$(echo "$NEXTCLOUD_WEBDAV_BASE_URI" | sed -n 's|^http[s]*://\([^:/]*\).*|\1|p')"
          if [ "$WEBDAV_HOSTNAME" = "127.0.0.1" ] || [ "$WEBDAV_HOSTNAME" = "localhost" ]; then
            FINAL_WEBDAV_URI="$(echo "$NEXTCLOUD_WEBDAV_BASE_URI" | sed "s|://127\.0\.0\.1:|://$HOST_IP:|g; s|://localhost:|://$HOST_IP:|g")"
            echo "  Rewrote loopback WebDAV host to $HOST_IP for containers."
          else
            FINAL_WEBDAV_URI="$NEXTCLOUD_WEBDAV_BASE_URI"
          fi

          echo "===> Writing environment file..."
          printf '%s\n' \
            'APP_NAME="madeena_cp"' \
            'APP_DISPLAY_NAME="Madeena Company Profile"' \
            'APP_ENV=production' \
            'APP_DEBUG=false' \
            'APP_TIMEZONE=Asia/Jakarta' \
            '' \
            'LOG_CHANNEL=stack' \
            'LOG_STACK=single' \
            'LOG_LEVEL=error' \
            '' \
            'DB_CONNECTION=mysql' \
            'DB_PORT=3306' \
            '' \
            'BROADCAST_CONNECTION=log' \
            'FILESYSTEM_DISK=public' \
            'PUBLIC_STORAGE_DRIVER=webdav' \
            'PUBLIC_STORAGE_THROW=true' \
            'QUEUE_CONNECTION=database' \
            'CACHE_STORE=database' \
            'SESSION_DRIVER=database' \
            'SESSION_LIFETIME=120' \
            '' \
            "APP_STORAGE_HOST_PATH=${APP_STORAGE_HOST_PATH}" \
            "APP_LOGS_HOST_PATH=${APP_LOGS_HOST_PATH}" \
            "MYSQL_DATA_HOST_PATH=${MYSQL_DATA_HOST_PATH}" \
            '' \
            'NEXTCLOUD_WEBDAV_PUBLIC_ROOT=madeena_cp_media' \
            'NEXTCLOUD_WEBDAV_BACKUP_ROOT=madeena_cp_backups' \
            'NEXTCLOUD_WEBDAV_TIMEOUT=30' \
            'NEXTCLOUD_WEBDAV_VERIFY_SSL=false' \
            'ENTERPRISE_BACKUP_DRIVER=webdav' \
            'ENTERPRISE_BACKUP_THROW=true' \
            'ENTERPRISE_BACKUP_LOCAL_ROOT=/var/www/enterprise_backups' \
            '' \
            'MAIL_MAILER=smtp' \
            'MAIL_SCHEME=null' \
            'MAIL_HOST=smtp.gmail.com' \
            'MAIL_PORT=587' \
            'MAIL_ENCRYPTION=tls' \
            'VITE_APP_NAME="Madeena Company Profile"' \
            > .env

          {
            printf 'APP_KEY=%s\n' "$APP_KEY"
            printf 'APP_URL=https://%s\n' "$APP_DOMAIN"
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_ROOT_PASSWORD=%s\n' "$DB_ROOT_PASSWORD"
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM_ADDRESS=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_FROM_NAME=%s\n' "Madeena Company Profile"
            printf 'SUPER_ADMIN_EMAIL=%s\n' "$SUPER_ADMIN_EMAIL"
            printf 'SUPER_ADMIN_PASSWORD=%s\n' "$SUPER_ADMIN_PASSWORD"
            printf 'NEXTCLOUD_USERNAME=%s\n' "$NEXTCLOUD_USERNAME"
            printf 'NEXTCLOUD_WEBDAV_BASE_URI=%s\n' "$FINAL_WEBDAV_URI"
            printf 'NEXTCLOUD_WEBDAV_USERNAME=%s\n' "$NEXTCLOUD_WEBDAV_USERNAME"
            printf 'NEXTCLOUD_WEBDAV_PASSWORD=%s\n' "$NEXTCLOUD_WEBDAV_PASSWORD"
            printf 'APP_VERSION=%s\n' "$LIVE_VERSION"
          } >> .env

          echo "===> Swarm manager preflight..."
          SWARM_STATE="$(docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null || echo unknown)"
          SWARM_MANAGER="$(docker info --format '{{.Swarm.ControlAvailable}}' 2>/dev/null || echo false)"
          if [ "$SWARM_STATE" != "active" ] || [ "$SWARM_MANAGER" != "true" ]; then
            echo "FATAL: Docker Swarm is not active or this node is not a manager."
            echo "State: $SWARM_STATE | Manager: $SWARM_MANAGER"
            exit 1
          fi

          echo "===> Verifying local image madeena_cp:latest..."
          docker image inspect madeena_cp:latest >/dev/null 2>&1 || {
            echo "FATAL: madeena_cp:latest is not available locally."
            exit 1
          }

          WEBDAV_HOSTNAME="$(echo "$FINAL_WEBDAV_URI" | sed -n 's|^http[s]*://\([^:/]*\).*|\1|p')"
          WEBDAV_PORT="$(echo "$FINAL_WEBDAV_URI" | sed -n 's|^http[s]*://[^:]*:\([0-9]*\).*|\1|p; t; s|^http://.*|80|p; s|^https://.*|443|p')"
          RESOLVED_IP="$(getent hosts "$WEBDAV_HOSTNAME" | awk '{print $1; exit}' 2>/dev/null || true)"
          RESOLVED_IP="${RESOLVED_IP:-$WEBDAV_HOSTNAME}"

          echo "===> WebDAV host preflight: ${WEBDAV_HOSTNAME}:${WEBDAV_PORT} (${RESOLVED_IP})"
          if ! timeout 5 bash -c "</dev/tcp/${RESOLVED_IP}/${WEBDAV_PORT}" 2>/dev/null; then
            echo "FATAL: WebDAV endpoint is not reachable from the host."
            exit 1
          fi

          echo "===> Ensuring WebDAV folders exist..."
          for folder in madeena_cp_media madeena_cp_backups; do
            code="$(curl -sS -w "%{http_code}" -o /dev/null -4 \
              --user "$NEXTCLOUD_WEBDAV_USERNAME:$NEXTCLOUD_WEBDAV_PASSWORD" \
              -X MKCOL "${FINAL_WEBDAV_URI%/}/${folder}" 2>/dev/null || echo "000")"
            if [ "$code" != "201" ] && [ "$code" != "405" ]; then
              echo "FATAL: MKCOL for ${folder} returned HTTP ${code}."
              exit 1
            fi
            echo "  ${folder}: ready"
          done

          webdav_probe() {
            root="$1"
            probe_name="deploy-preflight-$(date -u +%Y%m%d%H%M%S)-${RANDOM}.txt"
            payload="madeena-cp-webdav-preflight:${root}:${probe_name}"
            url="${FINAL_WEBDAV_URI%/}/${root}/${probe_name}"
            tmp_get="$(mktemp)"
            tmp_out="$(mktemp)"
            trap 'rm -f "$tmp_get" "$tmp_out"' RETURN

            set +e
            put_code="$(printf '%s' "$payload" | curl -sS -w "%{http_code}" -o "$tmp_out" -4 \
              --user "$NEXTCLOUD_WEBDAV_USERNAME:$NEXTCLOUD_WEBDAV_PASSWORD" \
              --connect-timeout 5 --max-time 30 -T - "$url")"
            put_rc=$?
            set -e
            if [ "$put_rc" -ne 0 ] || { [ "$put_code" != "200" ] && [ "$put_code" != "201" ] && [ "$put_code" != "204" ]; }; then
              echo "FATAL: WebDAV PUT failed for ${root} (curl=${put_rc}, http=${put_code})."
              cat "$tmp_out" 2>/dev/null || true
              exit 1
            fi

            set +e
            get_code="$(curl -sS -w "%{http_code}" -o "$tmp_get" -4 \
              --user "$NEXTCLOUD_WEBDAV_USERNAME:$NEXTCLOUD_WEBDAV_PASSWORD" \
              --connect-timeout 5 --max-time 30 "$url")"
            get_rc=$?
            set -e
            if [ "$get_rc" -ne 0 ] || [ "$get_code" != "200" ] || [ "$(cat "$tmp_get")" != "$payload" ]; then
              echo "FATAL: WebDAV GET/readback failed for ${root} (curl=${get_rc}, http=${get_code})."
              exit 1
            fi

            delete_code="$(curl -sS -w "%{http_code}" -o /dev/null -4 \
              --user "$NEXTCLOUD_WEBDAV_USERNAME:$NEXTCLOUD_WEBDAV_PASSWORD" \
              --connect-timeout 5 --max-time 30 -X DELETE "$url" 2>/dev/null || echo "000")"
            if [ "$delete_code" != "200" ] && [ "$delete_code" != "204" ]; then
              echo "FATAL: WebDAV DELETE failed for ${root} (http=${delete_code})."
              exit 1
            fi
            rm -f "$tmp_get" "$tmp_out"
            trap - RETURN
            echo "  ${root}: write/read/delete ok"
          }

          webdav_probe madeena_cp_media
          webdav_probe madeena_cp_backups

          echo "===> WebDAV container network preflight..."
          docker run --rm \
            --entrypoint php \
            -e WEBDAV_HOST="$WEBDAV_HOSTNAME" \
            -e WEBDAV_PORT="$WEBDAV_PORT" \
            madeena_cp:latest \
            -r '$s=@fsockopen(getenv("WEBDAV_HOST"), (int) getenv("WEBDAV_PORT"), $errno, $errstr, 5); if (! $s) { fwrite(STDERR, "connect failed: ".$errstr.PHP_EOL); exit(1); } fclose($s);'

          echo "===> Laravel WebDAV disk preflight from container..."
          docker run --rm \
            --entrypoint php \
            --env-file .env \
            madeena_cp:latest \
            artisan storage:webdav-check --disk=public --disk=enterprise_backups -v

          echo "===> Deploying stack..."
          docker stack deploy \
            --resolve-image changed \
            -c docker-compose.prod.yml madeena_cp

          echo "===> [1/3] Waiting for database to be healthy..."
          _WAIT_DB=0
          until [ "$(docker ps -q -f name=madeena_cp_db -f status=running | head -n 1 | xargs -I {} docker inspect --format='{{.State.Health.Status}}' {} 2>/dev/null)" = "healthy" ]; do
            if [ "$_WAIT_DB" -ge 300 ]; then
              echo "FATAL: DB health check timed out."
              docker service logs madeena_cp_db --tail=80 2>/dev/null || true
              docker stack ps madeena_cp || true
              exit 1
            fi
            sleep 5
            _WAIT_DB=$((_WAIT_DB + 5))
            echo "  DB not healthy yet (${_WAIT_DB}s elapsed)"
          done
          echo "DB healthy."

          echo "===> [2/3] Waiting for app to be healthy..."
          _WAIT_APP=0
          until [ "$(docker ps -q -f name=madeena_cp_app -f status=running | head -n 1 | xargs -I {} docker inspect --format='{{.State.Health.Status}}' {} 2>/dev/null)" = "healthy" ]; do
            if [ "$_WAIT_APP" -ge 300 ]; then
              echo "FATAL: app health check timed out."
              docker service logs madeena_cp_app --tail=100 2>/dev/null || true
              docker stack ps madeena_cp || true
              exit 1
            fi
            sleep 5
            _WAIT_APP=$((_WAIT_APP + 5))
            echo "  App not healthy yet (${_WAIT_APP}s elapsed)"
          done

          CONTAINER="$(docker ps -q -f name=madeena_cp_app -f status=running | head -n 1)"
          echo "App healthy: $CONTAINER"

          echo "===> [3/3] Running post-deploy migrations and seeders..."
          set +e
          MIGRATE_OUTPUT="$(docker exec "$CONTAINER" php artisan migrate --force --seed 2>&1)"
          MIGRATE_EXIT=$?
          set -e
          if [ "$MIGRATE_EXIT" -ne 0 ]; then
            if echo "$MIGRATE_OUTPUT" | grep -q "SQLSTATE\[42S01\]"; then
              echo "Existing-table conflict detected; retrying migrate only."
              docker exec "$CONTAINER" php artisan migrate --force
            else
              echo "$MIGRATE_OUTPUT"
              exit 1
            fi
          fi

          echo "===> Waiting for queue worker..."
          _WAIT_Q=0
          until docker ps -q -f name=madeena_cp_queue -f status=running | head -n 1 | grep -q .; do
            if [ "$_WAIT_Q" -ge 120 ]; then
              echo "FATAL: queue worker did not start."
              docker service logs madeena_cp_queue --tail=80 2>/dev/null || true
              exit 1
            fi
            sleep 5
            _WAIT_Q=$((_WAIT_Q + 5))
          done
          echo "Queue worker running."

          docker exec "$CONTAINER" chown -R www-data:www-data storage bootstrap/cache || true
          docker exec "$CONTAINER" chmod -R 775 storage bootstrap/cache || true

          echo "===> Testing Nginx configuration..."
          _WAIT_NGINX=0
          until docker ps -q -f name=madeena_cp_nginx -f status=running | head -n 1 | grep -q .; do
            if [ "$_WAIT_NGINX" -ge 120 ]; then
              echo "FATAL: Nginx did not start."
              docker service logs madeena_cp_nginx --tail=80 2>/dev/null || true
              exit 1
            fi
            sleep 5
            _WAIT_NGINX=$((_WAIT_NGINX + 5))
          done

          NGINX_CONTAINER="$(docker ps -q -f name=madeena_cp_nginx -f status=running | head -n 1)"
          docker exec "$NGINX_CONTAINER" sh -c "nginx -t && nginx -s reload"
          docker stack ps madeena_cp
          echo "Deployment complete."

      - name: Strict image cleanup
        if: always()
        run: |
          set -euo pipefail
          LEGACY_REFS="$(docker images --format '{{.Repository}}:{{.Tag}}' | awk '$0 ~ /^madeena_cp:/ && $0 != "madeena_cp:latest"' || true)"
          if [ -n "${LEGACY_REFS:-}" ]; then
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              docker image rm -f "$ref" || true
            done <<< "$LEGACY_REFS"
          fi
          docker container prune -f || true
          docker image prune -f || true
          docker builder prune --filter "until=24h" -f || true

      - name: Health check
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if wget -q --spider --timeout=3 http://127.0.0.1:8011/up 2>/dev/null; then
              echo "Local /up is healthy."
              if [ -n "${APP_DOMAIN:-}" ]; then
                PUBLIC_STATUS="$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "https://${APP_DOMAIN}/up" || echo "000")"
                echo "Public /up status: ${PUBLIC_STATUS}"
                [ "$PUBLIC_STATUS" = "200" ] || { sleep 10; continue; }
              fi
              exit 0
            fi
            echo "Attempt ${attempt}/10 failed; waiting..."
            sleep 10
          done

          echo "Health check failed."
          docker exec "$(docker ps -q -f name=madeena_cp_app -f status=running | head -n 1)" tail -n 80 storage/logs/laravel.log 2>/dev/null || true
          docker service logs madeena_cp_app --tail=100 2>/dev/null || true
          docker service logs madeena_cp_nginx --tail=100 2>/dev/null || true
          docker stack ps madeena_cp 2>/dev/null || true
          exit 1

      - name: Post-deploy verification
        run: |
          set -euo pipefail
          PASS=0
          FAIL=0
          WARN=0

          _pass() { PASS=$((PASS + 1)); echo "  PASS: $1"; }
          _fail() { FAIL=$((FAIL + 1)); echo "  FAIL: $1"; }
          _warn() { WARN=$((WARN + 1)); echo "  WARN: $1"; }

          echo "===> Waiting for Swarm services to settle..."
          for svc in madeena_cp_app madeena_cp_db madeena_cp_nginx madeena_cp_queue; do
            _WAIT_REPL=0
            until [ "$(docker service ls --format '{{.Replicas}}' --filter "name=${svc}" 2>/dev/null | head -n 1)" = "1/1" ]; do
              if [ "$_WAIT_REPL" -ge 180 ]; then
                docker service logs "$svc" --tail=120 2>/dev/null || true
                docker service ps "$svc" --no-trunc 2>/dev/null || true
                exit 1
              fi
              sleep 5
              _WAIT_REPL=$((_WAIT_REPL + 5))
            done
          done

          echo "===> Post-deploy verification report"

          echo "1/8 Service replicas"
          for svc in madeena_cp_app madeena_cp_db madeena_cp_nginx madeena_cp_queue; do
            replicas="$(docker service ls --format '{{.Replicas}}' --filter "name=${svc}" 2>/dev/null || echo "")"
            if [ "$replicas" = "1/1" ]; then
              _pass "$svc: $replicas"
            else
              _fail "$svc: $replicas"
            fi
          done

          echo "2/8 Health checks"
          for svc in madeena_cp_app madeena_cp_db; do
            container="$(docker ps -q -f name="${svc}" -f status=running | head -n 1)"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$container" 2>/dev/null || echo none)"
            if [ "$health" = "healthy" ]; then
              _pass "$svc health: $health"
            else
              _fail "$svc health: $health"
            fi
          done

          echo "3/8 Update and rollback policy"
          for svc in madeena_cp_app madeena_cp_db madeena_cp_nginx madeena_cp_queue; do
            update_order="$(docker service inspect "$svc" --format='{{.Spec.UpdateConfig.Order}}' 2>/dev/null || echo "")"
            failure_action="$(docker service inspect "$svc" --format='{{.Spec.UpdateConfig.FailureAction}}' 2>/dev/null || echo "")"
            rollback_order="$(docker service inspect "$svc" --format='{{.Spec.RollbackConfig.Order}}' 2>/dev/null || echo "")"
            expected="stop-first"
            if [ "$svc" = "madeena_cp_app" ] || [ "$svc" = "madeena_cp_nginx" ]; then
              expected="start-first"
            fi
            if [ "$update_order" = "$expected" ] && [ "$failure_action" = "rollback" ] && [ "$rollback_order" = "$expected" ]; then
              _pass "$svc: update=$update_order rollback=$rollback_order"
            else
              _fail "$svc: update=$update_order failure=$failure_action rollback=$rollback_order"
            fi
          done

          echo "4/8 Resource limits"
          for svc in madeena_cp_app madeena_cp_db madeena_cp_nginx madeena_cp_queue; do
            mem_limit="$(docker service inspect "$svc" --format='{{.Spec.TaskTemplate.Resources.Limits.MemoryBytes}}' 2>/dev/null || echo 0)"
            if [ "${mem_limit:-0}" -gt 0 ] 2>/dev/null; then
              _pass "$svc memory limit set"
            else
              _fail "$svc memory limit missing"
            fi
          done

          echo "5/8 Queue worker"
          queue_cmd="$(docker service inspect madeena_cp_queue --format='{{join .Spec.TaskTemplate.ContainerSpec.Args " "}}' 2>/dev/null || echo "")"
          if echo "$queue_cmd" | grep -q "queue:work"; then
            _pass "queue:work command configured"
          else
            _fail "queue:work command missing"
          fi
          grace="$(docker service inspect madeena_cp_queue --format='{{.Spec.TaskTemplate.ContainerSpec.StopGracePeriod}}' 2>/dev/null || echo "")"
          if [ -n "$grace" ]; then
            _pass "queue stop grace period: $grace"
          else
            _warn "queue stop grace period missing"
          fi

          echo "6/8 Storage mounts"
          app_container="$(docker ps -q -f name=madeena_cp_app -f status=running | head -n 1)"
          full_storage_mount="$(docker inspect "$app_container" --format='{{range .Mounts}}{{if eq .Destination "/var/www/html/storage"}}{{.Destination}}{{end}}{{end}}' 2>/dev/null || true)"
          if [ -z "$full_storage_mount" ]; then
            _pass "full storage tree is not shared"
          else
            _fail "full storage tree is mounted"
          fi
          storage_app_mount="$(docker inspect "$app_container" --format='{{range .Mounts}}{{if eq .Destination "/var/www/html/storage/app"}}{{.Type}}:{{.Source}}{{end}}{{end}}' 2>/dev/null || true)"
          if [ -n "$storage_app_mount" ]; then
            _pass "storage/app mounted: $storage_app_mount"
          else
            _fail "storage/app mount missing"
          fi
          if docker exec "$app_container" sh -c 'test -d storage/framework/views && test -w storage/framework/views'; then
            _pass "framework views path is container-local and writable"
          else
            _fail "framework views path is not writable"
          fi

          echo "7/8 WebDAV disks"
          if docker exec "$app_container" php artisan storage:webdav-check --disk=public --disk=enterprise_backups -v; then
            _pass "WebDAV public and backup disks verified"
          else
            _fail "WebDAV storage check failed"
          fi

          echo "8/8 /storage media streaming"
          media_probe="deploy-check-$(date -u +%Y%m%d%H%M%S).txt"
          media_payload="madeena-cp-media-${media_probe}"
          docker exec -e MEDIA_PROBE="$media_probe" -e MEDIA_PAYLOAD="$media_payload" "$app_container" php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); Illuminate\Support\Facades\Storage::disk("public")->put(getenv("MEDIA_PROBE"), getenv("MEDIA_PAYLOAD"));'
          fetched="$(curl -fsS --max-time 10 "http://127.0.0.1:8011/storage/${media_probe}" || true)"
          docker exec -e MEDIA_PROBE="$media_probe" "$app_container" php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); Illuminate\Support\Facades\Storage::disk("public")->delete(getenv("MEDIA_PROBE"));' || true
          if [ "$fetched" = "$media_payload" ]; then
            _pass "/storage route streams public disk media"
          else
            _fail "/storage route did not return uploaded media"
          fi

          echo "Results: ${PASS} passed | ${FAIL} failed | ${WARN} warnings"
          {
            echo "# Deploy Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| passed | ${PASS} |"
            echo "| failed | ${FAIL} |"
            echo "| warnings | ${WARN} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Failure Diagnostic Dump
        if: failure()
        run: |
          set -uo pipefail
          echo "Stack task history"
          docker stack ps madeena_cp --no-trunc --format 'table {{.Name}}\t{{.CurrentState}}\t{{.Error}}' 2>/dev/null | head -30 || true
          for svc in madeena_cp_app madeena_cp_db madeena_cp_queue madeena_cp_nginx; do
            echo "Logs: $svc"
            docker service logs "$svc" --tail=80 --no-task-ids 2>/dev/null || true
          done
          df -h / /var/lib/docker 2>/dev/null || true
          free -h 2>/dev/null || true
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true
