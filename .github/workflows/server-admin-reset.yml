name: "Server — Force Admin Reset"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
  SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}

jobs:
  admin-reset:
    name: "Force Admin Credentials Reset"
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "1/3 — Validate Secrets"
        run: |
          set -euo pipefail
          echo "▶ Validating Action Secrets..."
          if [ -z "$SUPER_ADMIN_EMAIL" ] || [ -z "$SUPER_ADMIN_PASSWORD" ]; then
            echo "❌ MISSING SECRETS: SUPER_ADMIN_EMAIL or SUPER_ADMIN_PASSWORD is not set."
            exit 1
          fi
          echo "✅ Secrets validated successfully."

      - name: "2/3 — Execute Tinker Command in Container"
        run: |
          set -euo pipefail
          
          # Find the running madeena_cp_app container
          APP_CONTAINER=$(docker ps -q -f name=madeena_cp_app | head -n 1 || true)
          
          if [ -z "$APP_CONTAINER" ]; then
            echo "❌ No madeena_cp_app container found. Cannot execute reset command."
            exit 1
          fi
          
          echo "✅ App container found: $APP_CONTAINER"
          echo "▶ Running artisan tinker to update/create admin user..."
          
          docker exec \
            -e SUPER_ADMIN_EMAIL="$SUPER_ADMIN_EMAIL" \
            -e SUPER_ADMIN_PASSWORD="$SUPER_ADMIN_PASSWORD" \
            "$APP_CONTAINER" php artisan tinker --execute="
              try {
                  \$email = env('SUPER_ADMIN_EMAIL');
                  \$password = env('SUPER_ADMIN_PASSWORD');

                  if (!\$email || !\$password) {
                      echo '❌ Error: Environment variables were not passed correctly.' . PHP_EOL;
                      exit(1);
                  }

                  \$user = \App\Models\User::updateOrCreate(
                      ['email' => \$email],
                      [
                          'name' => 'Madeena Super Admin',
                          'password' => \Illuminate\Support\Facades\Hash::make(\$password),
                          'email_verified_at' => now(),
                          'role' => 'admin',
                      ]
                  );

                  \$user->refresh();

                  if (\$user->role !== 'admin') {
                      echo '❌ Error: Admin flags were not saved correctly.' . PHP_EOL;
                      exit(1);
                  }

                  echo '✅ Admin user [' . \$user->email . '] successfully updated or created with admin access.' . PHP_EOL;
              } catch (\Throwable \$e) {
                  echo '❌ Error: ' . \$e->getMessage() . PHP_EOL;
                  exit(1);
              }
            "