name: Firewall Debug — Preview Port

on:
  workflow_dispatch:
    inputs:
      action:
        description: Audit only or audit and add the preview rule
        required: true
        default: audit
        type: choice
        options:
          - audit
          - setup
      port:
        description: Preview port to inspect or open
        required: true
        default: "8011"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ufw:
    name: UFW Preview Port Debug
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Audit or configure ufw
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          ACTION: ${{ inputs.action }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail

          _sudo() {
            if [ -n "${SUDO_PASSWORD:-}" ]; then
              echo "$SUDO_PASSWORD" | sudo -S -p '' "$@" 2>/dev/null
            else
              sudo "$@"
            fi
          }

          if ! command -v ufw >/dev/null 2>&1; then
            echo "❌ ufw is not installed on this runner."
            exit 1
          fi

          echo "===> ufw status for port ${PORT}/tcp"
          _sudo ufw status verbose || true

          if [ "$ACTION" = "setup" ]; then
            echo "===> Applying preview-port rule for ${PORT}/tcp"
            if _sudo ufw status | grep -q "Status: active"; then
              if _sudo ufw status numbered | grep -q "${PORT}/tcp"; then
                echo "  rule already exists for ${PORT}/tcp"
              else
                _sudo ufw allow "${PORT}/tcp" comment 'Madeena preview port'
                echo "  added ufw rule for ${PORT}/tcp"
              fi
              _sudo ufw status verbose || true
            else
              echo "  ufw is inactive; no rule was added"
            fi
          else
            echo "===> Audit only; no firewall changes made"
          fi
