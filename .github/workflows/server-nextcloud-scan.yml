name: Server — Nextcloud File Scan

# ═══════════════════════════════════════════════════════════════════════════════
# Manually trigger Nextcloud's file-system scanner so that
# madeena_cp_storage and madeena_cp_backups appear (or stay visible)
# in the Nextcloud web UI after files are written directly to disk.
#
# Run this when:
#   • The deploy scan reported a failure (⚠️  Nextcloud file scan failed)
#   • Directories are not visible in Nextcloud after a deployment
#   • A backup was written directly to HDD and needs to be indexed
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which path to scan"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - storage
          - backups

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    name: Nextcloud File Scan
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Find running Nextcloud container
        id: find_nc
        env:
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${NEXTCLOUD_USERNAME:-}" ]; then
            echo "❌ FATAL: NEXTCLOUD_USERNAME secret is missing."
            exit 1
          fi

          NC_CONTAINER=$(docker ps -q --filter status=running --filter name=nextcloud_app | head -n 1)
          [ -z "$NC_CONTAINER" ] && \
            NC_CONTAINER=$(docker ps -q --filter status=running --filter name=nextcloud | head -n 1)

          if [ -z "$NC_CONTAINER" ]; then
            echo "❌ FATAL: No running Nextcloud container found."
            echo "Running containers:"
            docker ps --format 'table {{.Names}}\t{{.Status}}' | sed 's/^/  /'
            exit 1
          fi

          echo "✅ Found Nextcloud container: $NC_CONTAINER"
          echo "nc_container=$NC_CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Scan madeena_cp_storage
        if: inputs.target == 'both' || inputs.target == 'storage'
        env:
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NC_CONTAINER: ${{ steps.find_nc.outputs.nc_container }}
        run: |
          set -euo pipefail

          echo "===> Scanning /${NEXTCLOUD_USERNAME}/files/madeena_cp_storage ..."
          docker exec --user www-data "$NC_CONTAINER" \
            php /var/www/html/occ files:scan \
            --path="/${NEXTCLOUD_USERNAME}/files/madeena_cp_storage"
          echo "✅ Storage scan complete."

      - name: Scan madeena_cp_backups
        if: inputs.target == 'both' || inputs.target == 'backups'
        env:
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NC_CONTAINER: ${{ steps.find_nc.outputs.nc_container }}
        run: |
          set -euo pipefail

          echo "===> Scanning /${NEXTCLOUD_USERNAME}/files/madeena_cp_backups ..."
          docker exec --user www-data "$NC_CONTAINER" \
            php /var/www/html/occ files:scan \
            --path="/${NEXTCLOUD_USERNAME}/files/madeena_cp_backups"
          echo "✅ Backups scan complete."
