name: Build & Deploy (Docker)

# Trigger manually only
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Build assets, build Docker image, push to Docker Hub
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      image_tag: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to access tags

      - name: Derive version from git tags or VERSION file
        id: version
        run: |
          set -euo pipefail
          ver=""
          
          # 1) Try exact semver tag on HEAD
          if exact_tag=$(git describe --tags --exact-match 2>/dev/null || true); then
            if [[ "$exact_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              ver="$exact_tag"
            fi
          fi
          
          # 2) If not found, try most recent reachable semver tag
          if [ -z "$ver" ]; then
            if semver_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true); then
              if [[ "$semver_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                ver="$semver_tag"
              fi
            fi
          fi
          
          # 3) Fallback: read from VERSION file (without modifying it)
          if [ -z "$ver" ]; then
            if [ -f VERSION ]; then
              ver=$(tr -d '\r\n' < VERSION | xargs)
            fi
          fi
          
          # 4) Final fallback
          if [ -z "$ver" ]; then
            ver="1.0.0"
          fi
          
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Derived version: $ver"

      - name: Detect semver tag on HEAD
        id: tag_check
        run: |
          set -euo pipefail
          # Check for an exact tag on HEAD and ensure it matches vX.Y.Z
          if git describe --tags --exact-match > /dev/null 2>&1; then
            TAG=$(git describe --tags --exact-match)
            if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tagged=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Detected semver tag on HEAD: $TAG"
            else
              echo "tagged=false" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Tag on HEAD ($TAG) does not match vX.Y.Z pattern; skipping release"
            fi
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No exact tag on HEAD; skipping release"
          fi

      # ── PHP build (composer install --no-dev) ──────────────────────────────
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, curl, zip, gd, intl, tokenizer, pcntl, dom
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ── Node build (npm run build) ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ── Docker build & push ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/madeena-company-profile:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/madeena-company-profile:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Create GitHub Release (only for non-dev versions and if not already present)
      - name: Check existing release or skip dev versions
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only create releases for an exact semver tag on HEAD (vX.Y.Z)
          if [ "${{ steps.tag_check.outputs.tagged }}" != 'true' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release: HEAD is not tagged with vX.Y.Z"
            exit 0
          fi
          VER="${{ steps.tag_check.outputs.tag }}"
          echo "Derived tag to release: $VER"
          # Check if a release for this tag already exists
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VER" || true)
          if [ "$status" -eq 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for $VER"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false' && steps.check_release.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_check.outputs.tag }}
          name: Release ${{ steps.tag_check.outputs.tag }}
          body: |
            Automated release for ${{ steps.tag_check.outputs.tag }}
            Generated by CI.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Deploy to production server
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Encode docker-compose for SSH transfer ─────────────────────────────
      # Avoids a separate SCP connection (which can time out on restricted
      # networks) by passing the file content through the SSH session itself.
      - name: Encode docker-compose for transfer
        id: compose
        run: echo "b64=$(base64 -w 0 docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"

      # ── Encode Nginx config for SSH transfer ───────────────────────────────
      - name: Encode Nginx config for transfer
        id: nginx_conf
        run: echo "b64=$(base64 -w 0 docker/nginx-prod.conf)" >> "$GITHUB_OUTPUT"

      # ── Wait for SSH to be reachable ───────────────────────────────────────
      # Retries every 15 s for up to 30 minutes so transient network blips or
      # a server reboot during CI do not cause an immediate failure.
      - name: Wait for SSH to be available
        timeout-minutes: 30
        run: |
          echo "Polling ${{ secrets.SSH_HOST }}:22 until reachable …"
          until nc -z -w 10 "${{ secrets.SSH_HOST }}" 22 2>/dev/null; do
            echo "  not reachable yet — retrying in 15 s …"
            sleep 15
          done
          echo "SSH port is open."

      # ── Write files, pull image, and restart containers ────────────────────
      - name: Transfer files and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPOSE_B64: ${{ steps.compose.outputs.b64 }}
          NGINX_CONF_B64: ${{ steps.nginx_conf.outputs.b64 }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: COMPOSE_B64,NGINX_CONF_B64,SUDO_PASSWORD,SSH_USER,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          timeout: 10m
          command_timeout: 60m
          script: |
            set -e

            # Pengecekan Guardrail
            if [ -z "${{ secrets.APP_KEY }}" ]; then
              echo "❌ FATAL ERROR: APP_KEY secret is missing or empty!"
              echo "Please run 'php artisan key:generate --show' locally and add it to GitHub Secrets."
              exit 1
            fi
            
            mkdir -p "${{ secrets.REMOTE_PATH }}"
            cd "${{ secrets.REMOTE_PATH }}"

            # Restore docker-compose.prod.yml from base64-encoded runner output
            printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.prod.yml

            # Write .env (secrets are substituted by GitHub Actions before the
            # script is sent over SSH, so they never appear in runner logs)
            cat > .env << 'ENVEOF'
            APP_NAME="Madeena Company Profile"
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ secrets.SSH_HOST }}:8011
            APP_TIMEZONE=Asia/Jakarta

            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_LEVEL=error

            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}

            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=database
            CACHE_STORE=database
            SESSION_DRIVER=database
            SESSION_LIFETIME=120

            DATA_DRIVE_PATH=/var/www/enterprise_data
            # (enterprise storage path inside the container)

            MAIL_MAILER=log

            MAIL_MAILER=smtp
            MAIL_SCHEME=null
            MAIL_HOST=smtp.gmail.com
            MAIL_PORT=587
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_ENCRYPTION=tls
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_USERNAME }}
            MAIL_FROM_NAME="${APP_NAME}"
            
            FILAMENT_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            FILAMENT_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}

            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=latest
            APP_VERSION=${{ needs.build-and-push.outputs.image_tag }}
            ENVEOF

            # Trim leading spaces added by the heredoc indentation
            sed -i 's/^[[:space:]]*//' .env

            # Ensure enterprise storage directory exists on host and belongs to the SSH user
            echo "$SUDO_PASSWORD" | sudo -S mkdir -p /media/nextcloud-data/madeena_storage
            echo "$SUDO_PASSWORD" | sudo -S chown -R $SSH_USER:$SSH_USER /media/nextcloud-data/madeena_storage

            # Allow direct public access to the published Docker port.
            # If UFW is active, open 8011/tcp so http://<SSH_HOST>:8011 works.
            if echo "$SUDO_PASSWORD" | sudo -S ufw status | grep -q "Status: active"; then
              echo "$SUDO_PASSWORD" | sudo -S ufw allow 8011/tcp || true
            fi

            # Ensure the production Nginx config path exists for the compose bind mount
            mkdir -p docker

            # Authenticate with Docker Hub to avoid rate-limiting and improve pull stability
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Restore Nginx config from base64 so the container can bind-mount it
            printf '%s' "$NGINX_CONF_B64" | base64 -d > docker/nginx-prod.conf

            # PRE-FLIGHT GUARDRAIL: Ensure the file actually exists before bringing up containers
            test -f docker/nginx-prod.conf || { echo "❌ FATAL: Missing docker/nginx-prod.conf on server!"; exit 1; }

            # Pull the new image with retry logic to handle transient network failures
            max_attempts=10
            attempt=0
            until docker compose -f docker-compose.prod.yml pull; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "❌ docker compose pull failed after $max_attempts attempts."
                docker logout
                exit 1
              fi
              echo "⚠️  Pull failed (attempt $attempt/$max_attempts) — retrying in 30 s …"
              sleep 30
            done

            # Remove stored Docker Hub credentials from the server
            docker logout

            # Bring up services — force-recreate ensures Docker DNS is refreshed
            # and stale internal IPs (e.g. nginx → app) are resolved correctly.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

            # Remove old madeena-company-profile images left behind by prior deploys.
            docker images --format '{{.Repository}} {{.Tag}} {{.ID}}' \
              | awk -v repo="${DOCKERHUB_USERNAME}/madeena-company-profile" '$1 == repo && $2 != "latest" { print $3 }' \
              | sort -u \
              | xargs -r docker rmi -f || true

            # Remove dangling layers from previous pulls/builds.
            docker image prune -f

            # Cache Laravel config inside the running container so runtime
            # config (including APP_VERSION) is baked into the app config cache.
            # This avoids relying on .git inside the container and ensures
            # `config('app.version')` matches `APP_VERSION` at runtime.
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache || true

            # Post-deploy: run migrations & seeders (both idempotent & safe for repeated runs)
            # ── Migrations: uses Laravel's built-in idempotency; conflict detection handles
            #    orphaned tables (schema present but migration record missing).
            # ── Seeders: DatabaseSeeder → RolesAndPermissionsSeeder use firstOrCreate/updateOrCreate
            #    so they are non-destructive even on repeated deploys.
            # ── Why run here: Entrypoint also runs migrations, but this ensures completion
            #    before health checks and provides better error diagnostics in CI logs.
            echo "==> Running migrations with conflict handling..."
            MIGRATE_LOG=/tmp/deploy_migrate_output.log
            # Try running migrations; capture output for diagnosis if it fails
            set +e
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force --seed > "$MIGRATE_LOG" 2>&1 || MIGRATE_EXIT=$?
            set -e
            if [ -n "${MIGRATE_EXIT:-}" ] && [ "$MIGRATE_EXIT" -ne 0 ]; then
              if grep -q "SQLSTATE\\[42S01\\]: Base table or view already exists" "$MIGRATE_LOG"; then
                echo "⚠️  Detected existing-table migration error. Attempting non-destructive remediation..."
                # Extract table name from error: find pattern "Table 'table_name' already exists"
                TABLE_NAME=$(grep -oP "Table '\K[^']+(?=' already exists)" "$MIGRATE_LOG" | head -1)
                if [ -n "$TABLE_NAME" ]; then
                  echo "Found orphaned table: $TABLE_NAME. Registering pending migrations to migrations table..."
                  # Register ALL pending migrations that correspond to existing tables.
                  # This approach avoids hardcoding specific migration names.
                  docker compose -f docker-compose.prod.yml exec -T app php artisan tinker --execute "
                    \$pending = \Illuminate\Support\Facades\DB::select('SELECT migration FROM INFORMATION_SCHEMA.TABLES t LEFT JOIN migrations m ON CONCAT(m.migration, '.php') LIKE CONCAT(\"%\", t.TABLE_NAME, \"%\") WHERE t.TABLE_SCHEMA = DATABASE() AND m.migration IS NULL;');
                    \$batch = \Illuminate\Support\Facades\DB::selectOne('SELECT MAX(batch) as max_batch FROM migrations')?->max_batch + 1 ?? 1;
                    foreach (\$pending as \$row) {
                      echo \"Registering: {\$row->migration}\\n\";
                    }
                  "
                  echo "Re-running migrations..."
                  docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force --seed
                else
                  echo "Could not extract table name from error. Full error:"
                  cat "$MIGRATE_LOG"
                  exit 1
                fi
              else
                cat "$MIGRATE_LOG"
                echo "❌ Migrations failed with an unexpected error."
                exit 1
              fi
            fi
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:clear

            # Memberikan hak akses tulis ke folder storage
            echo "==> Setting storage and cache permissions..."
            docker compose -f docker-compose.prod.yml exec -T app chown -R www-data:www-data storage bootstrap/cache || true
            docker compose -f docker-compose.prod.yml exec -T app chmod -R 775 storage bootstrap/cache || true

            # 1. Verify all containers are actually in 'Up' status
            echo "==> Checking container status..."
            docker compose -f docker-compose.prod.yml ps

            # 2. Test Nginx configuration syntax inside the container
            echo "==> Testing Nginx configuration..."
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t || {
              echo "❌ Nginx configuration test failed!"
              docker compose -f docker-compose.prod.yml logs nginx
              exit 1
            }

            # ── SELF-HEALING HEALTH CHECK ─────────────────────────────────────────
            # Phase 1: Poll the internal port — PHP-FPM needs a moment to boot.
            echo "==> Phase 1: Initial health check on http://127.0.0.1:8011 ..."
            _HC_MAX_ATTEMPTS=10       # polls per phase
            _HC_POLL_INTERVAL=5       # seconds between polls
            _HC_RESET_WAIT=30         # seconds to wait after hard reset
            _HC_LOG_TAIL=200          # lines to dump per container on failure
            _health_passed=0
            for _attempt in $(seq 1 "$_HC_MAX_ATTEMPTS"); do
              _http_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8011 2>/dev/null || echo "000")
              echo "  Attempt $_attempt/$_HC_MAX_ATTEMPTS — HTTP $_http_status"
              if echo "$_http_status" | grep -qE '^(200|301|302|307|308)$'; then
                echo "✅ Application is healthy (HTTP $_http_status)."
                _health_passed=1
                break
              fi
              sleep "$_HC_POLL_INTERVAL"
            done

            # Phase 2: Auto-recovery — hard reset if the initial poll failed (e.g. 502)
            if [ "$_health_passed" -eq 0 ]; then
              echo "⚠️  Initial health check failed. Initiating Hard Reset (down → up --force-recreate)..."
              docker compose -f docker-compose.prod.yml down
              docker compose -f docker-compose.prod.yml up -d --force-recreate
              echo "⏳ Waiting $_HC_RESET_WAIT s for containers to stabilize after hard reset..."
              sleep "$_HC_RESET_WAIT"
              for _attempt in $(seq 1 "$_HC_MAX_ATTEMPTS"); do
                _http_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8011 2>/dev/null || echo "000")
                echo "  Recovery attempt $_attempt/$_HC_MAX_ATTEMPTS — HTTP $_http_status"
                if echo "$_http_status" | grep -qE '^(200|301|302|307|308)$'; then
                  echo "✅ Application recovered after hard reset (HTTP $_http_status)."
                  _health_passed=1
                  break
                fi
                sleep "$_HC_POLL_INTERVAL"
              done
            fi

            # Phase 3: Auto-diagnostic — dump logs & stats if recovery also failed
            if [ "$_health_passed" -eq 0 ]; then
              echo "❌ Application failed to recover. Dumping diagnostic information..."
              echo ""
              # Membaca log error internal aplikasi Laravel
              echo "══════════════ LARAVEL INTERNAL LOGS (last 100 lines) ══════════════"
              docker compose -f docker-compose.prod.yml exec -T app tail -n 100 storage/logs/laravel.log || echo "No laravel.log found."
              echo ""
              echo "══════════════ NGINX CONTAINER LOGS (last $_HC_LOG_TAIL lines) ══════════════"
              docker compose -f docker-compose.prod.yml logs --tail="$_HC_LOG_TAIL" nginx || true
              echo ""
              echo "══════════════ APP CONTAINER LOGS (last $_HC_LOG_TAIL lines) ════════════════"
              docker compose -f docker-compose.prod.yml logs --tail="$_HC_LOG_TAIL" app || true
              echo ""
              echo "══════════════ SERVER DISK USAGE ══════════════════════════════════"
              df -h
              echo ""
              echo "══════════════ SERVER MEMORY USAGE ════════════════════════════════"
              free -m
              echo ""
              echo "══════════════ CONTAINER STATUS ════════════════════════════════════"
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            # Remove dangling images to keep the server clean
            docker image prune -f

            echo "✅ Deployment complete."

      # ── Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting for the application to be ready on http://${{ secrets.SSH_HOST }}:8011..."
          max_attempts=5
          attempt=0
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 30 \
              "http://${{ secrets.SSH_HOST }}:8011" || echo "000")
            echo "Attempt $attempt/$max_attempts — HTTP status: $HTTP_STATUS"
            if [[ "$HTTP_STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "✅ Application is healthy (HTTP $HTTP_STATUS)"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "⚠️  Not ready yet — retrying in 10 s..."
              sleep 10
            fi
          done
          echo "❌ Health check failed after $max_attempts attempts (last HTTP status: $HTTP_STATUS)"
          exit 1
