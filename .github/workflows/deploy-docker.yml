name: Build & Deploy (Docker)

# Trigger manually only
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}/madeena-company-profile

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Build assets, build Docker image, push to Docker Hub
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      image_tag: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to access tags

      - name: Derive version from git tags or VERSION file
        id: version
        run: |
          set -euo pipefail
          ver=""
          
          # 1) Try exact semver tag on HEAD
          if exact_tag=$(git describe --tags --exact-match 2>/dev/null || true); then
            if [[ "$exact_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              ver="$exact_tag"
            fi
          fi
          
          # 2) If not found, try most recent reachable semver tag
          if [ -z "$ver" ]; then
            if semver_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true); then
              if [[ "$semver_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                ver="$semver_tag"
              fi
            fi
          fi
          
          # 3) Fallback: read from VERSION file (without modifying it)
          if [ -z "$ver" ]; then
            if [ -f VERSION ]; then
              ver=$(tr -d '\r\n' < VERSION | xargs)
            fi
          fi
          
          # 4) Final fallback
          if [ -z "$ver" ]; then
            ver="1.0.0"
          fi
          
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Derived version: $ver"

      - name: Detect semver tag on HEAD
        id: tag_check
        run: |
          set -euo pipefail
          # Check for an exact tag on HEAD and ensure it matches vX.Y.Z
          if git describe --tags --exact-match > /dev/null 2>&1; then
            TAG=$(git describe --tags --exact-match)
            if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tagged=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Detected semver tag on HEAD: $TAG"
            else
              echo "tagged=false" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Tag on HEAD ($TAG) does not match vX.Y.Z pattern; skipping release"
            fi
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No exact tag on HEAD; skipping release"
          fi

      # ── PHP build (composer install --no-dev) ──────────────────────────────
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo, pdo_mysql, xml, curl, zip, gd, intl, tokenizer, pcntl, dom
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # ── Node build (npm run build) ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ── Docker build & push ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Create GitHub Release (only for non-dev versions and if not already present)
      - name: Check existing release or skip dev versions
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only create releases for an exact semver tag on HEAD (vX.Y.Z)
          if [ "${{ steps.tag_check.outputs.tagged }}" != 'true' ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping release: HEAD is not tagged with vX.Y.Z"
            exit 0
          fi
          VER="${{ steps.tag_check.outputs.tag }}"
          echo "Derived tag to release: $VER"
          # Check if a release for this tag already exists
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VER" || true)
          if [ "$status" -eq 200 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for $VER"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false' && steps.check_release.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_check.outputs.tag }}
          name: Release ${{ steps.tag_check.outputs.tag }}
          body: |
            Automated release for ${{ steps.tag_check.outputs.tag }}
            Generated by CI.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Deploy to production server
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Wait for SSH to be reachable ───────────────────────────────────────
      # Retries every 15 s for up to 30 minutes so transient network blips or
      # a server reboot during CI do not cause an immediate failure.
      - name: Wait for SSH to be available
        timeout-minutes: 30
        run: |
          echo "Polling ${{ secrets.SSH_HOST || secrets.VPS_HOST }}:${{ secrets.SSH_PORT || secrets.VPS_PORT || 22 }} until reachable ..."
          until nc -z -w 10 "${{ secrets.SSH_HOST || secrets.VPS_HOST }}" "${{ secrets.SSH_PORT || secrets.VPS_PORT || 22 }}" 2>/dev/null; do
            echo "  not reachable yet — retrying in 15 s …"
            sleep 15
          done
          echo "SSH port is open."

      # ── Write files, pull image, and restart containers ────────────────────
      - name: Transfer files and restart containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          SSH_USER: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.VPS_PORT || 22 }}
          envs: SUDO_PASSWORD,SSH_USER,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          timeout: 10m
          command_timeout: 60m
          script: |
            set -e

            # Pengecekan Guardrail
            if [ -z "${{ secrets.APP_KEY }}" ]; then
              echo "❌ FATAL ERROR: APP_KEY secret is missing or empty!"
              echo "Please run 'php artisan key:generate --show' locally and add it to GitHub Secrets."
              exit 1
            fi
            
            DEPLOY_PATH="${{ secrets.REMOTE_PATH || secrets.APP_DEPLOY_PATH || '/var/www/madeena-website-company-profile' }}"
            echo "$SUDO_PASSWORD" | sudo -S mkdir -p "$DEPLOY_PATH"
            echo "$SUDO_PASSWORD" | sudo -S chown -R "$SSH_USER:$SSH_USER" "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Set MTU untuk interface VPN secara otomatis agar koneksi stabil
            # Script ini akan mencari interface yang berawalan 'tun' atau 'wg' (WireGuard)
            VPN_IFACE=$(ls /sys/class/net | grep -E '^tun|^wg' | head -n 1)
            
            if [ -n "$VPN_IFACE" ]; then
                echo "==> VPN Terdeteksi. Mengatur MTU 1200 untuk interface ($VPN_IFACE)..."
                echo "$SUDO_PASSWORD" | sudo -S ip link set dev "$VPN_IFACE" mtu 1200 || true
            else
                echo "==> Tidak ada interface VPN (tun/wg) aktif, melewati pengaturan MTU."
            fi

            # Write docker-compose.prod.yml directly so the file is never empty.
            cat > docker-compose.prod.yml <<'YML'
            # ─────────────────────────────────────────────────────────────────────────────
            # Madeena Company Profile — Production Docker Compose
            #
            # Required environment variables (supply via .env on the server):
            #   APP_KEY              Laravel application key
            #   APP_URL              Public URL (http://<SSH_HOST>:8011)
            #   DB_DATABASE          MySQL database name
            #   DB_USERNAME          MySQL application user
            #   DB_PASSWORD          MySQL application password
            #   DB_ROOT_PASSWORD     MySQL root password
            #
            # Deployment model:
            #   App   — Laravel PHP-FPM + nginx container exposed on host port 8011 (HTTP)
            #           APP_PORT env var overrides 8011 when a fallback port is selected.
            #   DB    — MySQL 8.4 with persistent named volume
            # ─────────────────────────────────────────────────────────────────────────────
            services:

              # ── Laravel application container ───────────────────────────────────────────
              app:
                image: ${DOCKER_IMAGE:-docker.io/${DOCKERHUB_USERNAME:-your-dockerhub-username}/madeena-company-profile:latest}
                container_name: madeena_profile_app
                restart: unless-stopped
                working_dir: /var/www/app
                env_file:
                  - .env
                environment:
                  APP_ENV: production
                  APP_DEBUG: 'false'
                  APP_URL: ${APP_URL:-http://127.0.0.1:8011}
                  APP_VERSION: ${APP_VERSION:-latest}
                  DB_CONNECTION: mysql
                  DB_HOST: mysql
                  DB_PORT: 3306
                  DB_DATABASE: ${DB_DATABASE:-madeena_company_profile}
                  DB_USERNAME: ${DB_USERNAME:-madeena}
                  DB_PASSWORD: ${DB_PASSWORD:-madeena_pass}
                  APP_TIMEZONE: Asia/Jakarta
                  LOG_CHANNEL: stack
                  LOG_STACK: single
                  LOG_LEVEL: error
                  FILESYSTEM_DISK: public
                  CACHE_STORE: file
                  SESSION_DRIVER: file
                  QUEUE_CONNECTION: sync
                volumes:
                  - ./storage:/var/www/app/storage
                  - ./bootstrap/cache:/var/www/app/bootstrap/cache
                depends_on:
                  mysql:
                    condition: service_healthy
                ports:
                  - "8011:80"
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 120s

              # ── MySQL 8.4 database ──────────────────────────────────────────────────────
              mysql:
                image: mysql:8.4
                container_name: madeena_profile_mysql
                restart: unless-stopped
                environment:
                  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
                  MYSQL_DATABASE: ${DB_DATABASE:-madeena_company_profile}
                  MYSQL_USER: ${DB_USERNAME:-madeena}
                  MYSQL_PASSWORD: ${DB_PASSWORD:-madeena_pass}
                  TZ: Asia/Jakarta
                volumes:
                  - mysql_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
                  interval: 10s
                  timeout: 5s
                  retries: 10

            volumes:
              mysql_data:
            YML

            # Write .env (secrets are substituted by GitHub Actions before the
            # script is sent over SSH, so they never appear in runner logs)
            cat > .env << 'ENVEOF'
            APP_NAME="Madeena Company Profile"
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_DOMAIN=${{ secrets.APP_DOMAIN }}
            APP_URL=http://${{ secrets.SSH_HOST }}:8011
            APP_TIMEZONE=Asia/Jakarta

            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_LEVEL=error

            DB_CONNECTION=mysql
            DB_HOST=mysql
            DB_PORT=3306
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}

            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=public
            QUEUE_CONNECTION=sync
            CACHE_STORE=file
            SESSION_DRIVER=file
            SESSION_LIFETIME=120

            MAIL_MAILER=smtp
            MAIL_SCHEME=null
            MAIL_HOST=smtp.gmail.com
            MAIL_PORT=587
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_ENCRYPTION=tls
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_USERNAME }}
            MAIL_FROM_NAME="${APP_NAME}"

            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}

            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            IMAGE_TAG=latest
            APP_VERSION=${{ needs.build-and-push.outputs.image_tag }}
            ENVEOF

            # Trim leading spaces added by the heredoc indentation
            sed -i 's/^[[:space:]]*//' .env

            # Ensure volume-mounted directories exist and are writable by the container user.
            # Without this, Laravel crashes on boot with "Please provide a valid cache path."
            # which causes the app container to restart-loop before migrations can run.
            mkdir -p storage/app/public storage/framework/cache/data \
                     storage/framework/sessions storage/framework/views \
                     storage/logs bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache

            # Authenticate with Docker Hub to avoid rate-limiting and improve pull stability
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull the new image with retry logic to handle transient network failures
            max_attempts=10
            attempt=0
            until docker compose -f docker-compose.prod.yml pull; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "❌ docker compose pull failed after $max_attempts attempts."
                docker logout
                exit 1
              fi
              echo "⚠️  Pull failed (attempt $attempt/$max_attempts) — retrying in 30 s …"
              sleep 30
            done

            # Remove stored Docker Hub credentials from the server
            docker logout

            # Stop existing containers to free port 8011 before bringing up new ones.
            # --remove-orphans cleans up any containers from a previous compose config.
            echo "==> Stopping existing containers to free port 8011..."
            docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            # Strict port requirement: port 8011 only. Do not attempt fallback ports.
            # If port 8011 is in use by a non-madeena process, fail and report it.
            if ss -tlnp 2>/dev/null | grep -qE ":8011([[:space:]]|$)"; then
              echo "❌ FATAL: Port 8011 is still in use by another process after stopping containers."
              echo "Please free port 8011 manually and re-run the deployment."
              ss -tlnp | grep ":8011" || true
              exit 1
            fi
            echo "==> Port 8011 is available."
            export APP_PORT=8011

            # Bring up services — force-recreate ensures Docker DNS is refreshed
            # and stale internal IPs (e.g. nginx → app) are resolved correctly.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate

            # Show current container status and early logs so the real crash reason
            # (e.g. missing env var, bad permissions) is visible immediately.
            docker compose -f docker-compose.prod.yml ps
            echo "==> Container logs (tail 100) ..."
            docker logs --tail 100 madeena_profile_app || true

            # Wait until the app container is Running+Healthy (or just Running if no
            # healthcheck). docker compose exec fails if the container is still
            # restarting, so we must not proceed to migrations until it stabilises.
            echo "==> Waiting for app container to be ready..."
            max_wait=120
            elapsed=0
            until [ "$elapsed" -ge "$max_wait" ]; do
              state=$(docker inspect -f '{{.State.Status}}' madeena_profile_app 2>/dev/null || echo "unknown")
              health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' madeena_profile_app 2>/dev/null || echo "unknown")

              echo "  app state=$state health=$health (t=${elapsed}s)"

              if [ "$health" = "healthy" ] || { [ "$health" = "none" ] && [ "$state" = "running" ]; }; then
                echo "✅ App container is ready."
                break
              fi

              if [ "$state" = "restarting" ] || [ "$state" = "exited" ]; then
                echo "⚠️  App is in $state state; recent logs:"
                docker logs --tail 50 madeena_profile_app || true
              fi

              sleep 1
              elapsed=$((elapsed+1))
            done

            if [ "$elapsed" -ge "$max_wait" ]; then
              echo "❌ App container did not become ready within ${max_wait}s."
              docker logs --tail 300 madeena_profile_app || true
              docker compose -f docker-compose.prod.yml ps || true
              exit 1
            fi

            # Remove old madeena-company-profile images left behind by prior deploys.
            docker images --format '{{.Repository}} {{.Tag}} {{.ID}}' \
              | awk -v repo="${DOCKERHUB_USERNAME}/madeena-company-profile" '$1 == repo && $2 != "latest" { print $3 }' \
              | sort -u \
              | xargs -r docker rmi -f || true

            # Remove dangling layers from previous pulls/builds.
            docker image prune -f

            # Post-deploy: run migrations (idempotent & safe for repeated runs)
            echo "==> Running migrations with conflict handling..."
            MIGRATE_LOG=/tmp/deploy_migrate_output.log
            MIGRATE_EXIT=0
            set +e
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force > "$MIGRATE_LOG" 2>&1 || MIGRATE_EXIT=$?
            set -e
            if [ "$MIGRATE_EXIT" -ne 0 ]; then
              if grep -q "SQLSTATE\\[42S01\\]: Base table or view already exists" "$MIGRATE_LOG"; then
                echo "⚠️  Detected existing-table migration error. Attempting non-destructive remediation..."
                TABLE_NAME=$(grep -oP "Table '\\K[^']+(?=' already exists)" "$MIGRATE_LOG" | head -1)
                if [ -n "$TABLE_NAME" ]; then
                  echo "Found orphaned table: $TABLE_NAME. Running Laravel Tinker diagnostics..."
                  docker compose -f docker-compose.prod.yml exec -T app php artisan tinker --execute "
                    \$pending = \Illuminate\Support\Facades\DB::select('SELECT t.TABLE_NAME FROM INFORMATION_SCHEMA.TABLES t LEFT JOIN migrations m ON CONCAT(m.migration, \".php\") LIKE CONCAT(\"%\", t.TABLE_NAME, \"%\") WHERE t.TABLE_SCHEMA = DATABASE() AND m.migration IS NULL');
                    foreach (\$pending as \$row) {
                      echo \"Found orphaned table: {\$row->TABLE_NAME}\n\";
                    }
                  " || true
                  echo "Re-running migrations after diagnostics..."
                  docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force || true
                else
                  echo "Could not extract table name from error. Full migration log:"
                  cat "$MIGRATE_LOG" || true
                  echo "---- CONTAINER (app) logs (tail 300) ----"
                  docker compose -f docker-compose.prod.yml logs --no-color --tail 300 app || true
                  exit 1
                fi
              else
                echo "---- MIGRATION EXIT CODE: $MIGRATE_EXIT ----"
                echo "---- MIGRATION LOG (begin) ----"
                if [ -s "$MIGRATE_LOG" ]; then
                  sed -n '1,300p' "$MIGRATE_LOG" || true
                else
                  echo "(migration log is empty)"
                fi
                echo "---- MIGRATION LOG (end) ----"
                echo "---- CONTAINER (app) logs (tail 300) ----"
                docker compose -f docker-compose.prod.yml logs --no-color --tail 300 app || true
                echo "❌ Migrations failed with an unexpected error."
                exit 1
              fi
            fi
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:clear || true
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache || true
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache || true

            # 1. Verify all containers are actually in 'Up' status
            echo "==> Checking container status..."
            docker compose -f docker-compose.prod.yml ps

            # ── SELF-HEALING HEALTH CHECK ─────────────────────────────────────────
            # Phase 1: Poll http://127.0.0.1:${APP_PORT} — PHP-FPM needs a moment to boot.
            echo "==> Phase 1: Initial health check on http://127.0.0.1:${APP_PORT} ..."
            _HC_MAX_ATTEMPTS=10       # polls per phase
            _HC_POLL_INTERVAL=5       # seconds between polls
            _HC_RESET_WAIT=30         # seconds to wait after hard reset
            _HC_LOG_TAIL=200          # lines to dump per container on failure
            _health_passed=0
            for _attempt in $(seq 1 "$_HC_MAX_ATTEMPTS"); do
              _http_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:${APP_PORT}/health" 2>/dev/null || echo "000")
              echo "  Attempt $_attempt/$_HC_MAX_ATTEMPTS — HTTP $_http_status"
              if echo "$_http_status" | grep -qE '^(200|301|302|307|308)$'; then
                echo "✅ Application is healthy (HTTP $_http_status)."
                _health_passed=1
                break
              fi
              sleep "$_HC_POLL_INTERVAL"
            done

            # Phase 2: Auto-recovery — hard reset if the initial poll failed (e.g. 502)
            if [ "$_health_passed" -eq 0 ]; then
              echo "⚠️  Initial health check failed. Initiating Hard Reset (down → up --force-recreate)..."
              docker compose -f docker-compose.prod.yml down
              docker compose -f docker-compose.prod.yml up -d --force-recreate
              echo "⏳ Waiting $_HC_RESET_WAIT s for containers to stabilize after hard reset..."
              sleep "$_HC_RESET_WAIT"
              for _attempt in $(seq 1 "$_HC_MAX_ATTEMPTS"); do
                _http_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://127.0.0.1:${APP_PORT}/health" 2>/dev/null || echo "000")
                echo "  Recovery attempt $_attempt/$_HC_MAX_ATTEMPTS — HTTP $_http_status"
                if echo "$_http_status" | grep -qE '^(200|301|302|307|308)$'; then
                  echo "✅ Application recovered after hard reset (HTTP $_http_status)."
                  _health_passed=1
                  break
                fi
                sleep "$_HC_POLL_INTERVAL"
              done
            fi

            # Phase 3: Auto-diagnostic — dump logs & stats if recovery also failed
            if [ "$_health_passed" -eq 0 ]; then
              echo "❌ Application failed to recover. Dumping diagnostic information..."
              echo ""
              echo "══════════════ LARAVEL INTERNAL LOGS (last 100 lines) ══════════════"
              docker compose -f docker-compose.prod.yml exec -T app tail -n 100 storage/logs/laravel.log || echo "No laravel.log found."
              echo ""
              echo "══════════════ APP CONTAINER LOGS (last $_HC_LOG_TAIL lines) ════════════════"
              docker compose -f docker-compose.prod.yml logs --tail="$_HC_LOG_TAIL" app || true
              echo ""
              echo "══════════════ SERVER DISK USAGE ══════════════════════════════════"
              df -h
              echo ""
              echo "══════════════ SERVER MEMORY USAGE ════════════════════════════════"
              free -m
              echo ""
              echo "══════════════ CONTAINER STATUS ════════════════════════════════════"
              docker compose -f docker-compose.prod.yml ps
              exit 1
            fi

            echo "✅ Deployment complete. Application available at http://${{ secrets.SSH_HOST }}:8011"

      # ── Health check ──────────────────────────────────────────────────────
      - name: Health check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY || secrets.VPS_SSH_KEY }}
        run: |
          SSH_HOST="${{ secrets.SSH_HOST || secrets.VPS_HOST }}"
          SSH_PORT="${{ secrets.SSH_PORT || secrets.VPS_PORT || 22 }}"
          SSH_USER="${{ secrets.SSH_USER || secrets.VPS_USER }}"

          # Write SSH key to a temp file for log retrieval on failed attempts
          SSH_KEY_FILE=$(mktemp)
          echo "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          SSH_OPTS="-i $SSH_KEY_FILE -p $SSH_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes"

          echo "Waiting for the application to be ready..."
          max_attempts=10
          attempt=0
          APP_URL="http://${SSH_HOST}:8011/health"
          while [ "$attempt" -lt "$max_attempts" ]; do
            attempt=$((attempt + 1))
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 30 \
              "$APP_URL" 2>/dev/null || echo "000")

            echo "Attempt $attempt/$max_attempts — HTTP status: $HTTP_STATUS"

            if echo "$HTTP_STATUS" | grep -qE '^(200|301|302|307|308)$'; then
              echo "✅ Application is healthy (HTTP $HTTP_STATUS) at http://${SSH_HOST}:8011"
              rm -f "$SSH_KEY_FILE"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "⚠️  Not ready yet — fetching container logs and retrying in 15 s..."
              echo "--- App container logs (last 100 lines) ---"
              ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
                "docker logs --tail 100 madeena_profile_app 2>&1 || true" \
                || echo "⚠️  SSH log retrieval timed out; will retry connection next attempt."
              sleep 15
            fi
          done

          echo "❌ Health check failed after $max_attempts attempts (last HTTP status: $HTTP_STATUS)"
          echo "--- Final app container logs ---"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "docker logs --tail 100 madeena_profile_app 2>&1 || true" || true
          rm -f "$SSH_KEY_FILE"
          exit 1

  notify:
    name: Notify Deployment Status
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=✅ Deployment successful" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Deployment failed" >> $GITHUB_OUTPUT
          fi

      - name: Output deployment summary
        run: |
          echo "## Deployment Summary"
          echo "- **Repository**: ${{ github.repository }}"
          echo "- **Branch**: ${{ github.ref_name }}"
          echo "- **Commit**: ${{ github.sha }}"
          echo "- **Status**: ${{ steps.status.outputs.status }}"
          echo "- **Application URL**: http://${{ secrets.SSH_HOST }}:8011"
