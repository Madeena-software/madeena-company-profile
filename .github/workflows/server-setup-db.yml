name: "Server - Database Setup and Backup"

on:
  workflow_dispatch:

concurrency:
  group: server-db-setup-and-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_SLUG: madeena_cp
  BACKUP_DIR: /media/nextcloud-data/madeena_cp_backups
  BACKUP_SCRIPT: /opt/madeena-cp-db-backup.sh
  DB_ENV_FILE: /opt/madeena-cp-db-backup.env
  DB_DATABASE: ${{ secrets.DB_DATABASE }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
  SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}

jobs:
  db-setup:
    name: Configure DB and Backups
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Validate secrets and locate DB container
        run: |
          set -euo pipefail

          echo "Checking required secrets..."
          missing=0
          for var in DB_DATABASE DB_USERNAME DB_PASSWORD DB_ROOT_PASSWORD SUDO_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "  missing: $var"
              missing=1
            else
              echo "  ok: $var"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "FATAL: one or more required secrets are missing."
            exit 1
          fi

          echo "Checking Docker access..."
          docker ps >/dev/null 2>&1 || {
            echo "FATAL: runner cannot access Docker."
            exit 1
          }

          DB_CONTAINER=$(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SLUG}_db" | head -n 1)
          if [ -z "$DB_CONTAINER" ]; then
            DB_CONTAINER=$(docker ps -q --filter "name=${APP_SLUG}_db" | head -n 1)
          fi

          if [ -z "$DB_CONTAINER" ]; then
            echo "FATAL: could not find the running ${APP_SLUG}_db container."
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | sed 's/^/  /'
            exit 1
          fi

          echo "DB_CONTAINER=$DB_CONTAINER" >> "$GITHUB_ENV"
          echo "  db container: $DB_CONTAINER"

      - name: Snapshot current DB state
        run: |
          set -euo pipefail

          db_query() {
            docker exec "$DB_CONTAINER" \
              mysql -u root -p"${DB_ROOT_PASSWORD}" \
              --batch --silent -e "$1"
          }

          echo "Current databases:"
          db_query "SHOW DATABASES;" | sed 's/^/  /'

          echo ""
          echo "Current grants for ${DB_USERNAME}:"
          docker exec "$DB_CONTAINER" \
            mysql -u root -p"${DB_ROOT_PASSWORD}" \
            --batch --silent \
            -e "SHOW GRANTS FOR '${DB_USERNAME}'@'%';" 2>/dev/null | sed 's/^/  /' || \
            echo "  (user not found or grants unavailable)"

          echo ""
          echo "Current backup directory:"
          if [ -d "$BACKUP_DIR" ]; then
            ls -lah "$BACKUP_DIR" | sed 's/^/  /'
          else
            echo "  (backup directory does not exist yet)"
          fi

      - name: Fix app user grants
        run: |
          set -euo pipefail

          db_query() {
            docker exec "$DB_CONTAINER" \
              mysql -u root -p"${DB_ROOT_PASSWORD}" \
              --batch --silent -e "$1"
          }

          db_exec() {
            docker exec "$DB_CONTAINER" \
              mysql -u root -p"${DB_ROOT_PASSWORD}" \
              -e "$1"
          }

          echo "Current grants before fix:"
          docker exec "$DB_CONTAINER" \
            mysql -u root -p"${DB_ROOT_PASSWORD}" \
            --batch --silent \
            -e "SHOW GRANTS FOR '${DB_USERNAME}'@'%';" 2>/dev/null | sed 's/^/  /' || true

          echo ""
          echo "Granting privileges on the configured database..."
          db_exec "GRANT ALL PRIVILEGES ON \`${DB_DATABASE}\`.* TO '${DB_USERNAME}'@'%';"
          db_exec "FLUSH PRIVILEGES;"

          echo ""
          echo "Verifying app user access..."
          set +e
          APP_CONN_OUT=$(docker exec "$DB_CONTAINER" \
            mysql -u "${DB_USERNAME}" -p"${DB_PASSWORD}" \
            --batch --silent --skip-column-names \
            -e "USE \`${DB_DATABASE}\`; SHOW TABLES;" 2>&1)
          APP_CONN_RC=$?
          set -e

          if [ "$APP_CONN_RC" -ne 0 ]; then
            echo "  FATAL: application user cannot read ${DB_DATABASE}."
            echo "  mysql output:"
            echo "$APP_CONN_OUT" | sed 's/^/    /'
            exit 1
          fi

          APP_TABLES=$(printf '%s\n' "$APP_CONN_OUT" | sed '/^$/d' | wc -l | tr -d '[:space:]')
          echo "  tables visible to app user: ${APP_TABLES:-0}"

          echo ""
          echo "Final grants after fix:"
          docker exec "$DB_CONTAINER" \
            mysql -u root -p"${DB_ROOT_PASSWORD}" \
            --batch --silent \
            -e "SHOW GRANTS FOR '${DB_USERNAME}'@'%';" 2>/dev/null | sed 's/^/  /'

      - name: Install backup script and cron job
        run: |
          set -euo pipefail

          _sudo() {
            echo "$SUDO_PASSWORD" | sudo -S -p '' "$@" 2>/dev/null
          }

          echo "Creating backup directory..."
          _sudo mkdir -p "$BACKUP_DIR"
          _sudo chmod 750 "$BACKUP_DIR"

          echo "Writing DB environment file..."
          TMP_ENV=$(mktemp)
          {
            printf 'DB_DATABASE=%q\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%q\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%q\n' "$DB_PASSWORD"
            printf 'DB_ROOT_PASSWORD=%q\n' "$DB_ROOT_PASSWORD"
            printf 'APP_SLUG=%q\n' "$APP_SLUG"
            printf 'BACKUP_DIR=%q\n' "$BACKUP_DIR"
          } > "$TMP_ENV"
          _sudo cp "$TMP_ENV" "$DB_ENV_FILE"
          _sudo chmod 600 "$DB_ENV_FILE"
          rm -f "$TMP_ENV"

          echo "Writing backup script..."
          TMP_SCRIPT=$(mktemp)
          cat > "$TMP_SCRIPT" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          ENV_FILE="/opt/madeena-cp-db-backup.env"
          if [ -f "$ENV_FILE" ]; then
            # shellcheck disable=SC1090
            . "$ENV_FILE"
          fi

          APP_SLUG="${APP_SLUG:-madeena_cp}"
          BACKUP_DIR="${BACKUP_DIR:-/media/nextcloud-data/madeena_cp_backups}"
          RETENTION_DAYS="${RETENTION_DAYS:-14}"
          DB_NAME="${DB_DATABASE:-}"
          DB_ROOT_PASS="${DB_ROOT_PASSWORD:-}"

          if [ -z "$DB_NAME" ] || [ -z "$DB_ROOT_PASS" ]; then
            echo "[$(date -u)] ERROR: DB_DATABASE or DB_ROOT_PASSWORD is empty." >&2
            exit 1
          fi

          if ! mountpoint -q /media/nextcloud-data; then
            echo "[$(date -u)] ERROR: /media/nextcloud-data is not mounted." >&2
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "[$(date -u)] ERROR: docker is not available." >&2
            exit 1
          fi

          DB_CONTAINER=$(docker ps -q --filter "label=com.docker.swarm.service.name=${APP_SLUG}_db" | head -n 1)
          if [ -z "$DB_CONTAINER" ]; then
            DB_CONTAINER=$(docker ps -q --filter "name=${APP_SLUG}_db" | head -n 1)
          fi

          if [ -z "$DB_CONTAINER" ]; then
            echo "[$(date -u)] ERROR: could not find ${APP_SLUG}_db container." >&2
            exit 1
          fi

          mkdir -p "$BACKUP_DIR"

          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          BACKUP_FILE="${BACKUP_DIR}/${APP_SLUG}-${DB_NAME}-${TIMESTAMP}.sql.gz"

          echo "[$(date -u)] Starting backup of '${DB_NAME}'..."
          docker exec "$DB_CONTAINER" \
            mysqldump -u root -p"${DB_ROOT_PASS}" \
            --single-transaction \
            --routines \
            --triggers \
            --events \
            --add-drop-table \
            "$DB_NAME" \
            | gzip > "$BACKUP_FILE"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "[$(date -u)] ERROR: backup file is empty." >&2
            rm -f "$BACKUP_FILE"
            exit 1
          fi

          SIZE=$(du -sh "$BACKUP_FILE" | awk '{print $1}')
          echo "[$(date -u)] Backup complete: $BACKUP_FILE ($SIZE)"

          find "$BACKUP_DIR" -maxdepth 1 -type f -name "${APP_SLUG}-${DB_NAME}-*.sql.gz" -mtime +"$RETENTION_DAYS" -delete

          EOF
          _sudo cp "$TMP_SCRIPT" "$BACKUP_SCRIPT"
          _sudo chmod 700 "$BACKUP_SCRIPT"
          rm -f "$TMP_SCRIPT"

          echo "Installing root crontab entry..."
          CURRENT_CRON=$(_sudo crontab -l 2>/dev/null || true)
          TMP_CRON=$(mktemp)
          printf '%s\n' "$CURRENT_CRON" | awk '
            /# madeena-cp-db-backup-start/ {skip=1; next}
            /# madeena-cp-db-backup-end/ {skip=0; next}
            skip == 0 {print}
          ' > "$TMP_CRON"
          {
            echo "# madeena-cp-db-backup-start"
            echo "CRON_TZ=Asia/Jakarta"
            echo "0 2 * * * $BACKUP_SCRIPT >> /var/log/madeena-cp-db-backup.log 2>&1 # madeena-cp-db-backup"
            echo "# madeena-cp-db-backup-end"
          } >> "$TMP_CRON"
          _sudo crontab "$TMP_CRON"
          rm -f "$TMP_CRON"

          echo "Backup script installed: $BACKUP_SCRIPT"
          echo "Backup env file installed: $DB_ENV_FILE"

      - name: Run first backup now
        run: |
          set -euo pipefail

          _sudo() {
            echo "$SUDO_PASSWORD" | sudo -S -p '' "$@" 2>/dev/null
          }

          echo "Running initial backup..."
          BACKUP_LOG=$(mktemp)
          set +e
          _sudo env DB_DATABASE="$DB_DATABASE" DB_ROOT_PASSWORD="$DB_ROOT_PASSWORD" bash "$BACKUP_SCRIPT" > "$BACKUP_LOG" 2>&1
          BACKUP_RC=$?
          set -e

          sed 's/^/  /' "$BACKUP_LOG"
          rm -f "$BACKUP_LOG"

          if [ "$BACKUP_RC" -ne 0 ]; then
            echo "FATAL: initial backup failed with exit code $BACKUP_RC."
            exit 1
          fi

          echo "Initial backup completed successfully."

      - name: Verify backup files
        run: |
          set -euo pipefail

          _sudo() {
            echo "$SUDO_PASSWORD" | sudo -S -p '' "$@" 2>/dev/null
          }

          echo "Latest backups in $BACKUP_DIR:"
          _sudo find "$BACKUP_DIR" -maxdepth 1 -type f -name 'madeena_cp-*.sql.gz' -print | sort | tail -5 | sed 's/^/  /'

          LATEST_BACKUP=$(_sudo find "$BACKUP_DIR" -maxdepth 1 -type f -name 'madeena_cp-*.sql.gz' -printf '%T@ %p\n' | sort -nr | head -n 1 | awk '{print $2}')
          if [ -z "${LATEST_BACKUP:-}" ]; then
            echo "FATAL: no backup file found."
            exit 1
          fi

          echo "Checking gzip integrity: $LATEST_BACKUP"
          _sudo gzip -t "$LATEST_BACKUP"

          TABLE_COUNT=$(_sudo sh -c "gzip -dc '$LATEST_BACKUP' | grep -c '^CREATE TABLE' || true")
          echo "CREATE TABLE statements found: ${TABLE_COUNT:-0}"

          echo "Backup workflow finished successfully."
