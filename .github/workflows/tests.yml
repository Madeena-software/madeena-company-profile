name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  tests:
    runs-on: self-hosted
    name: PHP 8.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, pdo_mysql, bcmath, gd, intl, igbinary, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Parity Guard (PHP/Laravel/Filament)
        run: |
          set -euo pipefail
          php -r "exit(PHP_VERSION_ID >= 80400 ? 0 : 1);" || { echo '❌ PHP must be >= 8.4'; exit 1; }
          php artisan --version | grep -Eq '^Laravel Framework 13\.' || { echo '❌ Laravel 13 is required'; exit 1; }
          # shellcheck disable=SC2016
          php -r 'require "vendor/autoload.php"; $v=\Composer\InstalledVersions::getPrettyVersion("filament/filament") ?? ""; exit(preg_match("/^v?5\./",$v)?0:1);' \
            || { echo '❌ Filament v5 is required'; exit 1; }

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: vendor/bin/phpunit
