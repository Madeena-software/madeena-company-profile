services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: madeena_website_app
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      OCTANE_SERVER: frankenphp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: madeena_website
      DB_USERNAME: root
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    ports:
      - "8000:80"
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: madeena_website_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: madeena_website
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_website_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_website_data:
